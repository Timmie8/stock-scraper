name: Stock Scraper

on:
  workflow_dispatch:          # Handmatig starten
  # schedule:
  #   - cron: '0 7 * * 1-5'   # Optioneel: elke werkdag om 07:00 UTC

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright pandas openpyxl
          playwright install chromium --with-deps

      - name: Run scraper
        run: python stock_scraper.py

      - name: Upload Excel result
        uses: actions/upload-artifact@v4
        with:
          name: stock-scores
          path: stock_scores.xlsx
